<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Trị Bài Viết | Cẩm Nang Xe Đạp</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      #custom-loading-screen {
        position: fixed;
        inset: 0;
        background: #07172c;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: system-ui, -apple-system, sans-serif;
        color: #ffffff;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s;
      }
      .loading-spinner {
        width: 64px;
        height: 64px;
        border: 4px solid rgba(6, 182, 212, 0.2);
        border-top: 4px solid #06b6d4;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loading-title {
        margin-top: 20px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #f8fafc;
      }
      .loading-subtitle {
        margin-top: 6px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="custom-loading-screen">
      <div class="loading-spinner">🚲</div>
      <div class="loading-title">CẨM NANG XE ĐẠP • TRUNG TÂM QUẢN TRỊ</div>
      <div class="loading-subtitle">Đang nạp hệ thống và đồng bộ menu...</div>
    </div>

    <script>
      try {
        ['decap-cms-user', 'netlify-cms-user'].forEach(function(k) {
          var v = localStorage.getItem(k);
          if (v && (v.indexOf('"undefined"') !== -1 || v.indexOf('test-repo') !== -1)) {
            localStorage.removeItem(k);
          }
        });
      } catch (e) {
        localStorage.clear();
      }

      window.addEventListener('DOMContentLoaded', function() {
        var checkInterval = setInterval(function() {
          // Tìm chính xác thanh menu bên trái (Sidebar) của Decap CMS để chèn nút Dashboard vào đứng chung hàng
          var sidebarList = document.querySelector('aside ul') || document.querySelector('.nc-menu-list') || document.querySelector('ul[class*="nc-netlify-ui"]');
          
          if (sidebarList && !document.getElementById('custom-sidebar-dashboard-btn')) {
            var li = document.createElement('li');
            li.style.cssText = 'margin: 6px 12px;';
            li.innerHTML = '<a id="custom-sidebar-dashboard-btn" href="/dashboard" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: #1e293b; font-weight: 600; font-size: 14px; text-decoration: none; border-radius: 8px; background: #f1f5f9; transition: all 0.2s; border: 1px solid #e2e8f0;">📊 Thống Kê Lượt Xem</a>';
            sidebarList.appendChild(li);
          }
          
          var cmsRoot = document.getElementById('nc-root');
          var loadingScreen = document.getElementById('custom-loading-screen');
          if (cmsRoot && cmsRoot.children.length > 0 && loadingScreen) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.visibility = 'hidden';
            setTimeout(function() {
              loadingScreen.remove();
            }, 500);
            clearInterval(checkInterval);
          }
        }, 300);
      });
    </script>

    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  </body>
</html>
