<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Trị Bài Viết | Cẩm Nang Xe Đạp</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      /* Tùy chỉnh CSS nhẹ để thêm nút Dashboard vào menu bên trái của Decap CMS trông cực kỳ mượt mà */
      .nc-app-header-actions { gap: 12px; }
    </style>
  </head>
  <body>
    <script>
      // Xóa token lỗi kẹt trong trình duyệt
      try {
        ['decap-cms-user', 'netlify-cms-user'].forEach(function(k) {
          var v = localStorage.getItem(k);
          if (v && (v.indexOf('"undefined"') !== -1 || v.indexOf('test-repo') !== -1)) {
            localStorage.removeItem(k);
          }
        });
      } catch (e) {
        localStorage.clear();
      }

      // Tự động chèn thêm nút mở Dashboard Thống Kê vào menu điều hướng bên trái khi CMS tải xong
      window.addEventListener('DOMContentLoaded', function() {
        var checkInterval = setInterval(function() {
          var nav = document.querySelector('ul[class*="nc-netlify-ui-CollectionList"]');
          if (!nav) {
            nav = document.querySelector('nav');
          }
          // Tìm thanh sidebar menu bên trái
          var sidebarList = document.querySelector('aside ul') || document.querySelector('.nc-menu-list');
          if (sidebarList && !document.getElementById('custom-dashboard-nav-btn')) {
            var li = document.createElement('li');
            li.style.cssText = 'margin-top: 12px; border-top: 1px solid #e2e8f0; padding-top: 12px;';
            li.innerHTML = '<a id="custom-dashboard-nav-btn" href="/dashboard" style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; color: #0284c7; font-weight: 600; font-size: 13px; text-decoration: none; border-radius: 8px; background: #f0f9ff; transition: all 0.2s;">📊 Thống Kê Dashboard</a>';
            sidebarList.appendChild(li);
          }
        }, 1000);
      });
    </script>
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  </body>
</html>
