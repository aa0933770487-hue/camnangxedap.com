<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Trị Bài Viết | Cẩm Nang Xe Đạp</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <script>
      // Tự động xóa token lỗi kẹt trong trình duyệt
      try {
        ['decap-cms-user', 'netlify-cms-user'].forEach(function(k) {
          var v = localStorage.getItem(k);
          if (v && (v.indexOf('"undefined"') !== -1 || v.indexOf('test-repo') !== -1)) {
            localStorage.removeItem(k);
          }
        });
      } catch (e) {
        localStorage.clear();
      }

      // Tự động chèn nút mở Dashboard thống kê vào menu bên trái của Decap CMS
      window.addEventListener('DOMContentLoaded', function() {
        var checkInterval = setInterval(function() {
          var sidebarList = document.querySelector('aside ul') || document.querySelector('.nc-menu-list') || document.querySelector('ul[class*="nc-netlify-ui"]');
          if (sidebarList && !document.getElementById('custom-dashboard-btn')) {
            var li = document.createElement('li');
            li.style.cssText = 'margin-top: 16px; border-top: 1px solid #e2e8f0; padding-top: 16px;';
            li.innerHTML = '<a id="custom-dashboard-btn" href="/dashboard" style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; color: #2563eb; font-weight: 700; font-size: 13px; text-decoration: none; border-radius: 8px; background: #eff6ff; transition: all 0.2s;">📊 Thống Kê Lượt Xem</a>';
            sidebarList.appendChild(li);
            clearInterval(checkInterval);
          }
        }, 800);
      });
    </script>
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  </body>
</html>
