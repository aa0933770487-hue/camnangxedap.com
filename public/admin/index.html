<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Trị Bài Viết | Cẩm Nang Xe Đạp</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      #custom-loading-screen {
        position: fixed;
        inset: 0;
        background: #07172c;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: system-ui, -apple-system, sans-serif;
        color: #ffffff;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      }
      .logo-container {
        position: relative;
        width: 90px;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-container::before {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #06b6d4, transparent, transparent, #3b82f6, #06b6d4);
        animation: spin 2s linear infinite;
      }
      .logo-container::after {
        content: '';
        position: absolute;
        inset: 0;
        background: #07172c;
        border-radius: 50%;
      }
      .loading-logo {
        position: relative;
        z-index: 10;
        width: 70px;
        height: 70px;
        object-fit: contain;
        border-radius: 50%;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loading-title {
        margin-top: 24px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #f8fafc;
      }
      .loading-subtitle {
        margin-top: 6px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="custom-loading-screen">
      <div class="logo-container">
        <img src="/images/logo.png" alt="Logo" class="loading-logo" />
      </div>
      <div class="loading-title">CẨM NANG XE ĐẠP • TRUNG TÂM QUẢN TRỊ</div>
      <div class="loading-subtitle">Đang nạp dữ liệu và khởi tạo giao diện an toàn...</div>
    </div>

    <script>
      try {
        ['decap-cms-user', 'netlify-cms-user'].forEach(function(k) {
          var v = localStorage.getItem(k);
          if (v && (v.indexOf('"undefined"') !== -1 || v.indexOf('test-repo') !== -1)) {
            localStorage.removeItem(k);
          }
        });
      } catch (e) {
        localStorage.clear();
      }

      window.addEventListener('DOMContentLoaded', function() {
        var isReady = false;
        var minTimePassed = false;

        setTimeout(function() {
          minTimePassed = true;
          tryHideLoading();
        }, 1800);

        // Quét liên tục mỗi 300ms để đảm bảo nút Thống Kê luôn xuất hiện trên menu bất kể bạn bấm sửa, thêm hay quay lại
        setInterval(function() {
          var sidebarLists = document.querySelectorAll('aside ul, .nc-menu-list, ul[class*="nc-netlify-ui"]');
          sidebarLists.forEach(function(sidebarList) {
            if (sidebarList && !sidebarList.querySelector('#custom-sidebar-dashboard-btn')) {
              var li = document.createElement('li');
              li.style.cssText = 'margin: 6px 12px;';
              li.innerHTML = '<a id="custom-sidebar-dashboard-btn" href="/dashboard" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: #1e293b; font-weight: 600; font-size: 14px; text-decoration: none; border-radius: 8px; background: #f1f5f9; transition: all 0.2s; border: 1px solid #e2e8f0;">📊 Thống Kê Lượt Xem</a>';
              sidebarList.appendChild(li);
            }
          });
        }, 300);

        var checkInterval = setInterval(function() {
          var cmsRoot = document.getElementById('nc-root');
          if (cmsRoot && cmsRoot.children.length > 0) {
            isReady = true;
            tryHideLoading();
          }
        }, 200);

        function tryHideLoading() {
          if (isReady && minTimePassed) {
            var loadingScreen = document.getElementById('custom-loading-screen');
            if (loadingScreen) {
              loadingScreen.style.opacity = '0';
              loadingScreen.style.visibility = 'hidden';
              setTimeout(function() {
                loadingScreen.remove();
              }, 600);
            }
            clearInterval(checkInterval);
          }
        }
      });
    </script>

    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  </body>
</html>
