backend:
  name: github
  repo: aa0933770487-hue/camnangxedap.com
  branch: main
  base_url: https://camnangxedap.pages.dev
  auth_endpoint: api/auth

local_backend: true

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Bài Viết & Xoay 360° Thực Tế"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Tiêu Đề Bài Viết", name: "title", widget: "string" }
      - { label: "Ảnh Đại Diện (Thumbnail)", name: "image", widget: "image", required: false }
      
      # --- QUẢN LÝ CHUỖI ẢNH XOAY 360 ĐỘ THỰC TẾ TRONG ADMIN ---
      - label: "🔄 Chuỗi Ảnh Xoay 360 Độ (Thứ tự từ góc 0 đến các góc xoay tiếp theo)"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Ảnh Chụp Thực Tế Góc Xoay", name: "src", widget: "image" }
          - { label: "Tên Góc Xoay (VD: 0° - Góc trước, 90° - Góc ngang, ...)", name: "label", widget: "string" }

      - { label: "🔗 Link Mua Hàng Sản Phẩm Này", name: "model3DLink", widget: "string", default: "https://shopxedap-chinh.com", required: false }
      - { label: "Mô Tả Ngắn (Chuẩn SEO)", name: "description", widget: "text" }
      - { label: "Ngày Đăng", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Chuyên Mục"
        name: "category"
        widget: "select"
        options:
          - "Kinh nghiệm chọn xe"
          - "Bảo dưỡng & Sửa chữa"
          - "Phụ kiện & Đồ chơi"
          - "Cung đường & Trải nghiệm"
      - { label: "Tác Giả", name: "author", widget: "string", default: "Ban Biên Tập Cẩm Nang Xe Đạp" }
      - { label: "Đánh Dấu Bài Nổi Bật", name: "featured", widget: "boolean", default: false }
      - { label: "Thời Gian Đọc Dự Kiến", name: "readTime", widget: "string", default: "5 phút" }
      - { label: "Nội Dung Bài Viết", name: "body", widget: "markdown" }